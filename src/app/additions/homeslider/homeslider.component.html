<section class="container pt-6">
  <div class="grid gap-4 md:grid-cols-3">
    <!-- Main carousel -->
    <div class="overflow-hidden rounded-xl md:col-span-2">
      <owl-carousel-o [options]="customOptions">
        <ng-template carouselSlide>
          <img src="assets/images/slider-image-1.jpeg" class="hero-slide" alt="Seasonal offers on fresh groceries">
        </ng-template>
        <ng-template carouselSlide>
          <img src="assets/images/slider-image-2.jpeg" class="hero-slide" alt="Daily deals on everyday essentials">
        </ng-template>
        <ng-template carouselSlide>
          <img src="assets/images/slider-image-3.jpeg" class="hero-slide" alt="New arrivals in store">
        </ng-template>
      </owl-carousel-o>
    </div>

    <!-- Side images -->
    <div class="grid grid-cols-2 gap-4 md:grid-cols-1">
      <img src="assets/images/slider-image-1.jpeg" loading="lazy" class="side-slide" alt="">
      <img src="assets/images/slider-image-2.jpeg" loading="lazy" class="side-slide" alt="">
    </div>
  </div>
</section>
