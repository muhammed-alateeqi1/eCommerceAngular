<article class="card-interactive group flex h-full flex-col overflow-hidden">
  <a [routerLink]="['/productdetails', product._id]" class="flex flex-1 flex-col">
    <div class="relative aspect-square overflow-hidden bg-gray-50 dark:bg-slate-800">
      <img [src]="product.imageCover" [alt]="product.title" loading="lazy"
           class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105">
      @if (product.ratingsAverage) {
        <span class="absolute right-2 top-2 inline-flex items-center gap-1 rounded-full bg-white/90 px-2 py-1
                     text-xs font-semibold text-gray-800 backdrop-blur
                     dark:bg-slate-900/90 dark:text-slate-100">
          <i class="fa fa-star rating-color" aria-hidden="true"></i>{{ product.ratingsAverage }}
        </span>
      }
    </div>

    <div class="flex flex-1 flex-col p-3">
      <span class="text-xs font-medium text-main">{{ product.category.name | lowercase }}</span>
      <h3 class="mt-1 line-clamp-2 text-sm font-semibold text-gray-900 dark:text-white">
        {{ product.title }}
      </h3>
      <p class="mt-auto pt-2 text-base font-bold text-gray-900 dark:text-white">
        {{ product.price }} <span class="text-xs font-medium muted">EGP</span>
      </p>
    </div>
  </a>

  <div class="px-3 pb-3">
    <button type="button" class="btn-primary w-full !py-2 text-xs"
            (click)="addToCart.emit(product._id)"
            [attr.aria-label]="'Add ' + product.title + ' to cart'">
      <i class="fa-solid fa-cart-plus" aria-hidden="true"></i>
      Add To Cart
    </button>
  </div>
</article>
