<section class="container py-8">
  <div class="mb-6">
    <h1 class="section-title">Brands</h1>
    <p class="mt-1 text-sm muted">Shop your favourite brands</p>
  </div>

  @if (loading) {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      @for (placeholder of skeletons; track $index) {
        <div class="card p-4">
          <div class="skeleton mb-3 h-20 w-full"></div>
          <div class="skeleton mx-auto h-4 w-1/2"></div>
        </div>
      }
    </div>
  } @else if (brands.length) {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      @for (brand of brands; track brand._id) {
        <article class="card-interactive flex flex-col items-center p-4">
          <div class="flex h-20 w-full items-center justify-center">
            <img [src]="brand.image" [alt]="brand.name" loading="lazy"
                 class="max-h-full max-w-full object-contain">
          </div>
          <p class="mt-3 truncate text-center text-sm font-semibold text-gray-900 dark:text-white">
            {{ brand.name }}
          </p>
        </article>
      }
    </div>
  } @else {
    <div class="card flex flex-col items-center gap-3 px-6 py-16 text-center">
      <i class="fa-solid fa-tags text-3xl muted" aria-hidden="true"></i>
      <p class="text-lg font-semibold text-gray-900 dark:text-white">No brands available</p>
    </div>
  }
</section>
