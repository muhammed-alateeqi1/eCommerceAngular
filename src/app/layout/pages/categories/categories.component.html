<section class="container py-8">
  <div class="mb-6">
    <h1 class="section-title">Categories</h1>
    <p class="mt-1 text-sm muted">Explore products by category</p>
  </div>

  @if (isLoading) {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
      @for (placeholder of skeletons; track $index) {
        <div class="card overflow-hidden">
          <div class="skeleton aspect-[4/3] !rounded-none"></div>
          <div class="p-4"><div class="skeleton mx-auto h-4 w-2/3"></div></div>
        </div>
      }
    </div>
  } @else if (categoryList.length) {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
      @for (category of categoryList; track category._id) {
        <a [routerLink]="['/category', category._id]" class="card-interactive group block overflow-hidden">
          <div class="aspect-[4/3] overflow-hidden bg-gray-50 dark:bg-slate-800">
            <img [src]="category.image" [alt]="category.name" loading="lazy"
                 class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105">
          </div>
          <div class="p-4 text-center">
            <h2 class="truncate font-semibold text-gray-900 dark:text-white">{{ category.name }}</h2>
            <span class="mt-1 inline-block text-xs font-medium text-main">View products →</span>
          </div>
        </a>
      }
    </div>
  } @else {
    <div class="card flex flex-col items-center gap-3 px-6 py-16 text-center">
      <i class="fa-solid fa-layer-group text-3xl muted" aria-hidden="true"></i>
      <p class="text-lg font-semibold text-gray-900 dark:text-white">No categories available</p>
    </div>
  }
</section>
